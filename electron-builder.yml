appId: com.harness.desktop
productName: harness-desktop
copyright: Copyright © 2026 harness-desktop

# 自动更新（021）：electron-updater 读取的发布源
publish:
  provider: github
  owner: Oissp
  repo: harness-desktop

directories:
  output: out
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - plugins/**/*
  - vendor/node/**/*
  - build/icon.png
  - build/tray/**/*
  - build/brand/**/*
  - package.json

# 不使用 asar：dsh profile 初始化会为安装包内的依赖创建符号链接，
# 需要真实文件路径（asar 内的符号链接目标不可靠）。
asar: false

npmRebuild: false

# Linux 产物钉死 Electron 42.9.3（PR #304 实践）：
# Electron 43.x 在 GNOME（Ubuntu 24.04 / Debian 13）下托盘图标坏掉——
#   43.4.0 的 SNI IconPixmap Get 报错，图标 ~3s 后消失；
#   43.4.1 的 name/path 注册串被拒。
# 42.9.3 内嵌的 Node（24.18.1）与 43.4.0 相同，原生 NAPI 模块兼容，
# 仅 Linux 产物降级；dev / 测试仍用 devDependencies 里的 43.4.0。
# 上游修复后删掉此行即可恢复跟随。
electronVersion: 42.9.3

# 复制完整 node_modules（见 scripts/after-pack.mjs）
afterPack: scripts/after-pack.mjs

# 原生模块（node-pty / koffi）解包，保证 ELECTRON_RUN_AS_NODE 下可加载
asarUnpack:
  - node_modules/.pnpm/node-pty*/**/*
  - node_modules/.pnpm/koffi*/**/*

# 仅构建 Debian 13 / amd64 .deb（见 .github/workflows/build-debian.yml）
linux:
  # 指向 build/icons 目录（标准 hicolor 命名 <size>x<size>.png）：electron-builder
  # 据此把各尺寸装进 /usr/share/icons/hicolor/<size>x<size>/apps/，桌面环境才能在
  # 程序菜单显示图标。若指向单张 1024×1024 的 icon.png，app-builder 只会返回一个
  # 1024 尺寸，而 hicolor 主题不声明 1024 目录 → 菜单图标不显示。
  icon: build/icons
  category: Development
  target:
    - target: deb
      arch:
        - x64
  maintainer: harness-desktop <zhuanz@users.noreply.github.com>

# fpm 打 deb 的压缩是 CI 构建的最大瓶颈（默认 xz，CI 日志约 2 分钟）。
# 实测当前 623MB 原始数据：gzip -9 又大又慢（~185MB，且 gzip -9 比 xz -3 还慢）；
# xz -3 → ~138MB / CI 约 2min；zstd -9 → ~148MB / CI 约 20-30s（10 倍提速，只大 10MB）。
# electron-builder 的 deb.compression 枚举只有 gz|bzip2|xz|lzo，不支持 zst，
# 所以走 deb.fpm 追加 CLI 参数覆盖：app-builder 总会先发 --deb-compression xz，
# fpm 的 clamp 后出现者生效 → zst，--deb-compression-level 9 = ZSTD_CLEVEL=-9。
# 容器需装 zstd 包；dpkg (Debian 12+/13) 原生支持 .zst 的 deb。
deb:
  fpm:
    - --deb-compression
    - zst
    - --deb-compression-level
    - '9'

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
